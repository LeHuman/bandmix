[package]
name = "bandmix"
authors = ["LeHuman"]
version = "0.1.5"
edition = "2021"
description = "A minimal autoplayer of bandcamp's discover section"
repository = "https://github.com/lehuman/bandmix"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.98"
chrono = "0.4.38"
crossbeam = { version = "0.8.4", features = ["crossbeam-queue"] }
dashmap = "6.1.0"
gjson = "0.8.1"
html-escape = "0.2.13"
localsavefile = "0.2.12"
once_cell = "1.20.2"
reqwest = { version = "0.12.15", features = ["blocking", "json"] }
rodio = "0.20.1"
savefile = "0.18.6"
scraper = "0.23.1"
sharded-slab = "0.1.7"
stream-download = "0.15.1"
strum = { version = "0.27.1", features = ["derive"] }
tokio = { version = "1.44.2", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
url = "2.5.4"

[target.'cfg(target_os = "macos")'.dependencies]
souvlaki = "0.8.2"

[target.'cfg(target_os = "linux")'.dependencies]
souvlaki = { version = "0.8.1", default-features = false, features = [
    "use_zbus",
] }

[target.'cfg(windows)'.dependencies]
souvlaki = "0.8.2"
windows = { version = "0.60.0", features = [
    "Media",
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.1"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
