[package]
name = "bandmix"
authors = ["LeHuman"]
version = "0.1.6"
edition = "2021"
description = "A minimal autoplayer of bandcamp's discover section"
repository = "https://github.com/lehuman/bandmix"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.100"
crossbeam = { version = "0.8.4", features = ["crossbeam-queue"] }
dashmap = "6.1.0"
gjson = "0.8.1"
html-escape = "0.2.13"
http-cache-reqwest = "0.16.0"
savefile = "0.20.2"
localsavefile = "0.2.18"
once_cell = "1.21.3"
reqwest = { version = "0.12.28", features = ["blocking", "json"] }
reqwest-middleware = "0.4.2"
reqwest-retry = "0.9.1"
rodio = { version = "0.21.1", features = ["playback", "tracing"] }
scraper = "0.24.0"
sharded-slab = "0.1.7"
stream-download = { version = "0.22.9", features = ["reqwest-middleware"] }
strum = { version = "0.27.2", features = ["derive"] }
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = "2.5.8"
reqwest-leaky-bucket = "0.4.0"

[target.'cfg(target_os = "macos")'.dependencies]
souvlaki = "0.8.3"

[target.'cfg(target_os = "linux")'.dependencies]
souvlaki = { version = "0.8.3", default-features = false, features = [
    "use_zbus",
] }

[target.'cfg(windows)'.dependencies]
souvlaki = "0.8.3"
windows = { version = "0.62.2", features = [
    "Media",
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.6"

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }

[package.metadata.cargo-machete]
ignored = ["savefile"]
